name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # uv gère lui-même la version de Python (pinnée dans .python-version, comme en local) —
      # pas besoin d'actions/setup-python en plus.
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      # Sync complet (dev inclus) : pytest/pytest-cov sont dans le groupe dev, nécessaires pour
      # lancer les tests. Aucun secret requis : la suite ne fait aucun appel réseau réel (voir
      # tests/*.py — extract_filters()/Mistral/appels payants volontairement exclus).
      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest tests/ -v
